name: Container validation

on:
  pull_request:
    paths:
      - .dockerignore
      - apps/api/Dockerfile
      - apps/web/Dockerfile
      - docker-compose.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**
      - packages/**
      - prisma/schema.prisma
      - prisma/migrations/**
      - .github/workflows/container-release.yml
      - .github/workflows/container-validation.yml
      - .github/workflows/application-gates.yml
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - apps/api/Dockerfile
      - apps/web/Dockerfile
      - docker-compose.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**
      - packages/**
      - prisma/schema.prisma
      - prisma/migrations/**
      - .github/workflows/container-release.yml
      - .github/workflows/container-validation.yml
      - .github/workflows/application-gates.yml

permissions:
  contents: read

jobs:
  static:
    name: Validate workflow, Dockerfiles, and Compose
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile
          failure-threshold: warning
          ignore: DL3018

      - name: Lint web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          failure-threshold: warning
          ignore: DL3018

      - name: Check Dockerfile release contract
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in apps/api/Dockerfile apps/web/Dockerfile; do
            test "$(grep -c '^FROM ' "$dockerfile")" -ge 2
            grep -q 'pnpm install --frozen-lockfile' "$dockerfile"
            grep -q '^USER node$' "$dockerfile"
            grep -q '^HEALTHCHECK ' "$dockerfile"
            grep -q '^EXPOSE 3000$' "$dockerfile"
            if grep -Eiq '(^|[[:space:]])(COPY|ADD)[^#]*(\.env|credentials|secret)' "$dockerfile"; then
              echo "::error::Secret-bearing input is copied by ${dockerfile}"
              exit 1
            fi
          done
          if grep -Eq '(^|/)(\*\*/)?prisma/migrations(/|\*|$)' .dockerignore; then
            echo "::error::Checked-in Prisma migrations must be available in the Docker build context"
            exit 1
          fi
          grep -q '^FROM workspace AS migration$' apps/api/Dockerfile
          grep -q '^CMD \["pnpm", "db:migrate"\]$' apps/api/Dockerfile
          grep -q '^      target: migration$' docker-compose.yml
          grep -q '^        condition: service_completed_successfully$' docker-compose.yml
          grep -q '^    restart: "no"$' docker-compose.yml
          grep -q '^ARG NEXT_PUBLIC_API_ORIGIN=' apps/web/Dockerfile
          grep -q '^ENV NEXT_PUBLIC_API_ORIGIN=' apps/web/Dockerfile
          grep -q '^\.env$' .dockerignore
          grep -q '^\.git$' .dockerignore

      - name: Validate local-only Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=test
          export POSTGRES_DB=repomentor_ci
          export POSTGRES_USER=repomentor_ci
          export POSTGRES_PASSWORD="compose-check-${GITHUB_RUN_ID}"
          export POSTGRES_HOST_PORT=55432
          export REDIS_PASSWORD="compose-check-${GITHUB_RUN_ID}"
          export REDIS_HOST_PORT=56379
          export API_HOST_PORT=58080
          export WEB_HOST_PORT=58081
          export DATABASE_URL="postgresql://repomentor_ci:compose-check-${GITHUB_RUN_ID}@postgres:5432/repomentor_ci"
          export REDIS_URL="redis://:compose-check-${GITHUB_RUN_ID}@redis:6379"
          export JWT_ACCESS_SECRET="compose-check-access-${GITHUB_RUN_ID}-0123456789abcdef"
          export JWT_REFRESH_SECRET="compose-check-refresh-${GITHUB_RUN_ID}-fedcba9876543210"
          export COOKIE_SECURE=false
          export COOKIE_SAME_SITE=lax
          export QUOTA_ADMISSION_FINGERPRINT_SECRET="test-only-quota-admission-fingerprint-fixture-32-bytes"
          export NEXT_PUBLIC_API_ORIGIN="http://127.0.0.1:${API_HOST_PORT}"
          docker compose config --quiet

  build:
    name: Build ${{ matrix.name }} image without publishing
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - name: migration
            dockerfile: apps/api/Dockerfile
            target: migration
          - name: web
            dockerfile: apps/web/Dockerfile
            target: runtime
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without registry credentials or push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: repomentor/${{ matrix.name }}:validation-${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=repomentor-validation-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=repomentor-validation-${{ matrix.name }}

      - name: Smoke-test API liveness
        if: matrix.name == 'api'
        shell: bash
        run: |
          set -euo pipefail
          image="repomentor/api:validation-${GITHUB_SHA}"
          container="repomentor-api-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT

          # NODE_ENV=test intentionally checks only the HTTP liveness route.
          docker run --pull=never --detach \
            --name "$container" \
            --publish 127.0.0.1:18080:3000 \
            --env NODE_ENV=test \
            "$image" >/dev/null

          for attempt in {1..30}; do
            if (( attempt % 5 == 0 )); then
              echo "Waiting for API liveness (attempt ${attempt}/30)"
            fi
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:18080/health/live; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::API liveness smoke test timed out"
          docker logs "$container" || true
          exit 1

      - name: Smoke-test web shell
        if: matrix.name == 'web'
        shell: bash
        run: |
          set -euo pipefail
          image="repomentor/web:validation-${GITHUB_SHA}"
          container="repomentor-web-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT

          docker run --pull=never --detach \
            --name "$container" \
            --publish 127.0.0.1:18081:3000 \
            "$image" >/dev/null

          for attempt in {1..30}; do
            if (( attempt % 5 == 0 )); then
              echo "Waiting for web shell (attempt ${attempt}/30)"
            fi
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:18081/; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::Web shell smoke test timed out"
          docker logs "$container" || true
          exit 1
