# Local-only application and infrastructure services. Required values come from .env.
services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    image: repomentor-api-migration:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to a URL using the postgres service name}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - local-infrastructure
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: repomentor-api:local
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to a comma-separated browser-origin allowlist}
      PORT: "3000"
      # Supply URL-encoded credentials and use the Compose service names so the API stays inside the local network.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to a URL using the postgres service name}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set to a URL using the redis service name}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE must be set}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:?COOKIE_SAME_SITE must be set}
      QUOTA_ADMISSION_FINGERPRINT_SECRET: ${QUOTA_ADMISSION_FINGERPRINT_SECRET:?QUOTA_ADMISSION_FINGERPRINT_SECRET must be set}
    ports:
      - "127.0.0.1:${API_HOST_PORT:?API_HOST_PORT must be set}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - local-infrastructure
    # This is process liveness only; it does not assert PostgreSQL or Redis readiness.
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/health/live
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # This is baked into browser assets; use http://localhost:<API_HOST_PORT>, not api:3000.
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:?NEXT_PUBLIC_API_ORIGIN must be set}
    image: repomentor-web:local
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:?WEB_HOST_PORT must be set}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - local-infrastructure
    # The web image has no dedicated health route; this checks its HTTP shell only.
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT must be set}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local-infrastructure
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:?REDIS_HOST_PORT must be set}:6379"
    volumes:
      - redis_data:/data
    networks:
      - local-infrastructure
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  local-infrastructure:
    driver: bridge
    internal: true
